<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טופס לוטו — הדמיה</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #eeeae5; color: #222;
  font-family: Arial, sans-serif;
}
header, .tools, .notice {
  max-width: 440px; margin: 16px auto; padding: 0 12px;
  text-align: center;
}
h1 { color: #d82f36; margin-bottom: 8px; }
p { line-height: 1.5; }
.tools {
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center;
}
.tools button {
  border: 0; border-radius: 8px; padding: 12px 16px;
  background: #c92731; color: white; font: bold 15px Arial;
  cursor: pointer;
}
.tools .secondary { background: #454545; }
button:focus-visible {
  outline: 3px solid #155ac1; outline-offset: 2px;
}
.ticket {
  width: calc(100% - 16px); max-width: 400px;
  margin: 16px auto; padding: 14px 10px;
  background: #fffdf8; border: 1px solid #d7c9bd;
  border-radius: 8px;
}
.ticket-heading {
  color: #d82f36; text-align: center;
  border-bottom: 4px solid #d82f36;
  padding-bottom: 12px; margin-bottom: 8px;
}
.ticket-heading h2 { font-size: 36px; margin: 0 0 4px; }
.legend {
  display: grid; grid-template-columns: 10fr 2fr;
  gap: 7px; direction: ltr; text-align: center;
  color: #b7202c; font-size: 12px; font-weight: bold;
  margin-bottom: 6px;
}
.panel {
  margin-bottom: 7px; padding-bottom: 5px;
  border-bottom: 1px solid #ed8c91;
}
.fields {
  display: grid; grid-template-columns: 10fr 2fr;
  gap: 7px; direction: ltr;
}
.numbers {
  display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 1px; align-content: start;
}
.strong {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px; align-content: start;
  border-left: 2px solid #d82f36; padding-left: 4px;
}
.table-title, .strong-title {
  background: #d82f36; color: white;
  display: grid; place-items: center;
  font-size: 11px; font-weight: bold; direction: rtl;
}
.table-title { grid-column: span 3; }
.pick {
  appearance: none; -webkit-appearance: none;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; height: 27px; padding: 0;
  border: 0; border-radius: 3px;
  background: transparent; color: #ca2933;
  font: bold 11px Arial, sans-serif;
  cursor: pointer; touch-action: manipulation;
}
.pick::after {
  content: ""; width: 16px; height: 6px;
  margin-top: 1px; border: 1px solid #d82f36;
  border-radius: 3px;
}
.pick[aria-pressed="true"] {
  background: #ffe2e3; color: #171717;
}
.pick[aria-pressed="true"]::after {
  background: #171717; border-color: #171717;
}
.panel-status {
  margin-top: 3px; text-align: right;
  font-size: 10px; color: #6e5252;
}
.panel[data-complete="true"] .panel-status { color: #17663c; }
#message {
  min-height: 24px; font-weight: bold; color: #9d202a;
}
footer {
  text-align: center; color: #b7202c;
  font-size: 12px; line-height: 1.6; padding-top: 8px;
}
</style>
</head>
<body>
<header>
  <h1>טופס הלוטו שלי</h1>
  <p>
    בכל טבלה בחר 6 מספרים ומספר חזק אחד.<br>
    אפשר למלא טבלה אחת או יותר; אין חובה למלא את כולן.
  </p>
</header>

<div class="tools">
  <button type="button" id="random">מילוי אקראי לכל הטבלאות</button>
  <button type="button" id="clear" class="secondary">ניקוי הכול</button>
  <button type="button" id="validate" class="secondary">בדיקת הטופס</button>
</div>

<div class="notice">
  <p id="message" role="status" aria-live="polite">
    הטווח הוא 1–37, והמספר החזק הוא 1–7.
  </p>
</div>

<main class="ticket" aria-label="טופס לוטו">
  <div class="ticket-heading">
    <h2>לוטו</h2>
    <span>הדמיה • 6 מספרים + מספר חזק</span>
  </div>
  <div class="legend">
    <span dir="rtl">6 מספרים מתוך 37</span>
    <span dir="rtl">חזק</span>
  </div>
  <div id="tables"></div>
  <footer>
    הדמיה עצמאית לשעשוע בלבד, ללא קשר למפעל הפיס.<br>
    הטופס אינו נשלח להגרלה ואינו מנבא תוצאות.
  </footer>
</main>

<script>
const tables = document.getElementById('tables');
const message = document.getElementById('message');
const states = [];

function makeButton(number, strong, tableIndex) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'pick';
  button.textContent = number;
  button.dataset.number = number;
  button.setAttribute('aria-pressed', 'false');
  button.setAttribute(
    'aria-label',
    `טבלה ${tableIndex + 1}, ${strong ? 'מספר חזק' : 'מספר'} ${number}`
  );

  button.addEventListener('click', () => {
    const state = states[tableIndex];

    if (strong) {
      state.strong = state.strong === number ? null : number;
    } else if (state.numbers.has(number)) {
      state.numbers.delete(number);
    } else {
      if (state.numbers.size === 6) {
        message.textContent =
          `בטבלה ${tableIndex + 1} כבר נבחרו 6 מספרים. בטל מספר כדי להחליפו.`;
        return;
      }
      state.numbers.add(number);
    }

    render(tableIndex);
    message.textContent =
      `טבלה ${tableIndex + 1}: נבחרו ${state.numbers.size} מתוך 6 מספרים` +
      (state.strong === null
        ? ', חסר מספר חזק.'
        : `, המספר החזק הוא ${state.strong}.`);
  });

  return button;
}

for (let i = 0; i < 14; i++) {
  const panel = document.createElement('section');
  panel.className = 'panel';
  panel.setAttribute('aria-label', `טבלה ${i + 1}`);

  const fields = document.createElement('div');
  fields.className = 'fields';

  const numbers = document.createElement('div');
  numbers.className = 'numbers';
  numbers.setAttribute('role', 'group');
  numbers.setAttribute('aria-label', 'בחירת שישה מספרים');

  const title = document.createElement('div');
  title.className = 'table-title';
  title.textContent = `טבלה ${i + 1}`;
  numbers.appendChild(title);

  for (let number = 1; number <= 37; number++) {
    numbers.appendChild(makeButton(number, false, i));
  }

  const strong = document.createElement('div');
  strong.className = 'strong';
  strong.setAttribute('role', 'group');
  strong.setAttribute('aria-label', 'בחירת מספר חזק אחד');

  const strongTitle = document.createElement('div');
  strongTitle.className = 'strong-title';
  strongTitle.textContent = 'חזק';
  strong.appendChild(strongTitle);

  for (let number = 1; number <= 7; number++) {
    strong.appendChild(makeButton(number, true, i));
  }

  const status = document.createElement('div');
  status.className = 'panel-status';

  fields.append(numbers, strong);
  panel.append(fields, status);
  tables.appendChild(panel);

  states.push({
    numbers: new Set(), strong: null,
    panel, numbersElement: numbers, strongElement: strong, status
  });
  render(i);
}

function render(index) {
  const state = states[index];

  state.numbersElement.querySelectorAll('button').forEach(button => {
    button.setAttribute(
      'aria-pressed',
      String(state.numbers.has(Number(button.dataset.number)))
    );
  });

  state.strongElement.querySelectorAll('button').forEach(button => {
    button.setAttribute(
      'aria-pressed',
      String(state.strong === Number(button.dataset.number))
    );
  });

  const complete = state.numbers.size === 6 && state.strong !== null;
  state.panel.dataset.complete = String(complete);
  state.status.textContent =
    `${state.numbers.size}/6 מספרים · ` +
    (state.strong === null ? 'חסר מספר חזק' : `חזק: ${state.strong}`) +
    (complete ? ' · הטבלה מלאה ✓' : '');
}

document.getElementById('random').addEventListener('click', () => {
  states.forEach((state, index) => {
    const pool = Array.from({ length: 37 }, (_, i) => i + 1);

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    state.numbers = new Set(pool.slice(0, 6));
    state.strong = Math.floor(Math.random() * 7) + 1;
    render(index);
  });

  message.textContent =
    'מולאו 14 טבלאות, בכל אחת 6 מספרים שונים ומספר חזק אחד.';
});

document.getElementById('clear').addEventListener('click', () => {
  states.forEach((state, index) => {
    state.numbers.clear();
    state.strong = null;
    render(index);
  });
  message.textContent = 'כל הסימונים נוקו.';
});

document.getElementById('validate').addEventListener('click', () => {
  const incomplete = [];
  let complete = 0;

  states.forEach((state, index) => {
    const started = state.numbers.size > 0 || state.strong !== null;
    const valid = state.numbers.size === 6 && state.strong !== null;
    if (valid) complete++;
    else if (started) incomplete.push(index + 1);
  });

  if (incomplete.length) {
    message.textContent =
      `יש להשלים 6 מספרים ומספר חזק בטבלאות: ${incomplete.join(', ')}.`;
  } else if (complete) {
    message.textContent = `הטופס תקין: ${complete} טבלאות מלאות.`;
  } else {
    message.textContent = 'הטופס ריק. יש למלא לפחות טבלה אחת.';
  }
});
</script>
</body>
</html>
