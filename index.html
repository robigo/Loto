<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הלוטו שלי</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f0f4fa;
      color: #17243b;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 40px #17243b15;
      text-align: center;
    }
    h1 { margin: 0 0 12px; }
    p { color: #52617a; line-height: 1.6; }
    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 24px 0;
      direction: ltr;
    }
    .cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 1px solid #d5deeb;
      border-radius: 50%;
      font-weight: bold;
    }
    .selected {
      background: #175bdb;
      border-color: #175bdb;
      color: white;
    }
    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #175bdb;
      color: white;
      font: bold 18px Arial, sans-serif;
      cursor: pointer;
    }
    button:hover { background: #1248b0; }
    button:focus-visible { outline: 3px solid #eea900; outline-offset: 4px; }
    #result { min-height: 52px; font-weight: bold; }
    small { color: #52617a; }
  </style>
</head>
<body>
  <main>
    <h1>🎱 הלוטו שלי</h1>
    <p>הגרלת 6 מספרים ללא חזרות<br>בטווח 20–37</p>

    <div class="board" id="board" aria-label="לוח המספרים"></div>

    <button type="button" id="generate">מלא לי מספרים</button>
    <p id="result" role="status" aria-live="polite">
      לחץ על הכפתור כדי להגריל
    </p>
    <small>הדמיה לשעשוע בלבד · אינה מנבאת תוצאות לוטו</small>
  </main>

  <script>
    const board = document.getElementById('board');
    const result = document.getElementById('result');
    const numbers = Array.from({ length: 18 }, (_, i) => i + 20);

    numbers.forEach(number => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = number;
      cell.dataset.number = number;
      board.appendChild(cell);
    });

    document.getElementById('generate').addEventListener('click', () => {
      const pool = [...numbers];

      // ערבוב המספרים ובחירת שישה ללא חזרות.
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const selected = pool.slice(0, 6).sort((a, b) => a - b);

      board.querySelectorAll('.cell').forEach(cell => {
        const picked = selected.includes(Number(cell.dataset.number));
        cell.classList.toggle('selected', picked);
        cell.setAttribute(
          'aria-label',
          cell.dataset.number + (picked ? ' — נבחר' : '')
        );
      });

      result.textContent = 'המספרים שלך: ' + selected.join(' · ');
    });
  </script>
</body>
</html>
