name: Fetch and publish Lotto results
on:
  schedule:
    # Run after Tuesday and Saturday drawings (GitHub cron uses UTC).
    - cron: '15 0 * * 0,3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-lotto-results.yml'
      - 'scripts/update_results.py'
      - 'tests/test_update_results.py'
permissions:
  contents: write
concurrency:
  group: fetch-lotto-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test validation and preservation of existing data
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate published Pais results
        run: python scripts/update_results.py
      - name: Publish both data files when new draws are available
        run: |
          if git diff --quiet -- data/history.json data/draws.json; then
            echo "No new validated draws to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/draws.json
          git commit -m "data: publish validated Pais Lotto results"
          git push origin HEAD:main
