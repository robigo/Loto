name: Fetch published Lotto results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-lotto-results.yml'
      - 'scripts/update_results.py'
      - 'tests/test_update_results.py'
permissions:
  contents: read
concurrency:
  group: fetch-lotto-results
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test validation and preservation of existing data
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate Pais CSV in temporary checkout
        run: python scripts/update_results.py
      - name: Report new draws for reviewed publication
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          previous = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/history.json']))
          known = {draw['id'] for draw in previous}
          current = json.loads(Path('data/history.json').read_text())
          added = [draw for draw in current if draw['id'] not in known]
          print(json.dumps({'stage': 'validated_lotto_results', 'added': added, 'committed': False}, ensure_ascii=False))
          PY
      - name: Retain validated datasets for review
        uses: actions/upload-artifact@v4
        with:
          name: validated-lotto-results
          path: |
            data/history.json
            data/draws.json
          retention-days: 7
